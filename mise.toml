# kos-kit — mise-managed tools
# Anything mise can install lives here; non-mise tools are in kit.toml.

[tools]
# Languages / runtimes
bun  = "1.3.12"
node = "24"
go   = "1.26.2"
rust = "1.95.0"
uv   = "0.11.7"

# Shell goodies
starship = "1.24.2"
bat      = "0.26.1"
fd       = "10.4.2"
ripgrep  = "15.1.0"
fzf      = "0.71.0"
zoxide   = "0.9.9"
direnv   = "2.37.1"
delta    = "0.19.2"
yq       = "4.53.2"
atuin    = "18.15.2"

# Dev CLIs
gh   = "2.90.0"
just = "1.49.0"
prek = "0.3.9"

# eza — override backend so macOS doesn't compile from source
[tools.eza]
version = "0.23.4"
backend = "ubi:eza-community/eza"
